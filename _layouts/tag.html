<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elsfa7-110</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#8b5cf6;--text:#e6eef8}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;background:linear-gradient(180deg,var(--bg),#071024);color:var(--text);display:flex;align-items:center;justify-content:center;height:100vh}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:36px;border-radius:16px;box-shadow:0 8px 30px rgba(2,6,23,0.6);max-width:760px;width:90%;text-align:center}
    h1{margin:0 0 12px;font-size:28px;letter-spacing:0.6px}
    p{margin:0 0 20px;font-size:18px;opacity:0.95}
    .badge{display:inline-block;padding:8px 14px;border-radius:999px;background:linear-gradient(90deg, rgba(139,92,246,0.12), rgba(59,130,246,0.06));border:1px solid rgba(139,92,246,0.12);color:var(--accent);font-weight:600}
    .actions{display:flex;gap:10px;justify-content:center}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:10px 14px;border-radius:10px;color:var(--text);cursor:pointer;font-weight:600}
    .btn.secondary{border-style:dashed}
    footer{margin-top:18px;font-size:13px;opacity:0.6}
  </style>
</head>
<body>
  <div class="card">
    <h1>I am Elsfa7-110</h1>
    <p class="badge">Mission accomplished</p>

    <div style="height:18px"></div>

    <p>Welcome — this is a simple profile/demo page. You can edit the text, colors, or layout as you like.</p>

    <div class="actions">
      <button class="btn" onclick="copyText()">Copy text</button>
      <a class="btn secondary" href="data:text/html;charset=utf-8,<!DOCTYPE html><html><head><meta charset=\"utf-8\"></head><body><h1>I am Elsfa7-110</h1><p>Mission accomplished</p></body></html>" download="elsfa7-110.html">Download</a>
    </div>

    <footer>Made safe and demo-only — no hacking content included.</footer>
  </div>

  <script>
    function copyText(){
      const text = 'I am Elsfa7-110 — Mission accomplished';
      navigator.clipboard?.writeText(text).then(()=>{
        alert('Text copied to clipboard');
      }).catch(()=>{
        prompt('Copy this text manually:', text);
      });
    }
  </script>
</body>
</html>
